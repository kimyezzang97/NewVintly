<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>이메일 인증 - Vintly</title>
</head>
<body style="margin:0; padding:0; background-color:#f5f0eb; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">

<table width="100%" border="0" cellpadding="0" cellspacing="0" style="background-color:#f5f0eb; padding:40px 16px;">
    <tr>
        <td align="center">

            <!-- Card -->
            <table width="100%" border="0" cellpadding="0" cellspacing="0"
                   style="max-width:480px; background-color:#ffffff; border-radius:16px; box-shadow:0 4px 24px rgba(0,0,0,0.08); overflow:hidden;">

                <!-- Header -->
                <tr>
                    <td align="center" style="padding:36px 40px 28px; border-bottom:1px solid #f0e8df;">
                        <p style="margin:0; font-size:13px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:#a0876d;">Vintly</p>
                    </td>
                </tr>

                <!-- Body -->
                <tr>
                    <td style="padding:36px 40px 0;">
                        <p style="margin:0 0 8px; font-size:20px; font-weight:700; color:#1a1a1a; line-height:1.3;">
                            이메일 인증을 완료해 주세요
                        </p>
                        <p style="margin:0; font-size:15px; color:#6b6b6b; line-height:1.7;">
                            <span th:text="${nickname}" style="color:#1a1a1a; font-weight:600;"></span>님, Vintly에 가입해 주셔서 감사합니다.<br/>
                            아래 버튼을 눌러 본인 인증을 완료해 주세요.
                        </p>
                    </td>
                </tr>

                <!-- Button -->
                <tr>
                    <td align="center" style="padding:32px 40px;">
                        <a th:href="${url}"
                           style="display:inline-block; background-color:#a0876d; color:#ffffff; font-size:15px; font-weight:600; text-decoration:none; padding:14px 36px; border-radius:8px; letter-spacing:0.03em;">
                            이메일 인증하기
                        </a>
                    </td>
                </tr>

                <!-- Divider -->
                <tr>
                    <td style="padding:0 40px;">
                        <div style="height:1px; background-color:#f0e8df;"></div>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="padding:24px 40px 36px;">
                        <p style="margin:0; font-size:13px; color:#9e9e9e; line-height:1.7;">
                            본인이 요청하지 않은 경우 이 메일을 무시하셔도 됩니다.<br/>
                            문의사항: <a href="mailto:jvintaged@naver.com" style="color:#a0876d; text-decoration:none;">jvintaged@naver.com</a>
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
